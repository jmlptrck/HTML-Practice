<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css">
    <title>My Photo Gallery</title>

    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .gallery-title {
            color: #333;
            font-weight: bold;
        }

        .card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15) !important;
        }

        .card-header {
            font-size: 20px;
            font-weight: bold;
            padding: 15px 20px;
            border: none;
        }

        .card-body {
            padding: 10px;
            background-color: white;
        }

        .card-body img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <main class="container py-5">
        <div class="text-center mb-5">
            <h1 class="gallery-title">My Photo Gallery</h1>
            <p class="text-secondary">A collection of memorable moments and beautiful views.</p>
        </div>
        <div class="row g-4">

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">

                    <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
                        DC
                        <button type="button" class="btn-close" aria-label="Close"></button>
                    </div>

                    <div class="card-body">
                        <img src="../img/pic1.png" alt="DC photo">
                    </div>

                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">

                    <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
                        Group Photo
                        <button type="button" class="btn-close" aria-label="Close"></button>
                    </div>

                    <div class="card-body">
                        <img src="../img/pic2.png" alt="Group photo">
                    </div>

                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">

                    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                        Scenery
                        <button type="button" class="btn-close" aria-label="Close"></button>
                    </div>

                    <div class="card-body">
                        <img src="../img/pic3.png" alt="Scenery photo">
                    </div>

                </div>
            </div>

        </div>

        <!-- Footer -->
        <footer class="text-center mt-5 text-secondary">
            <p class="mb-0">&copy; 2026 My Photo Gallery. All Rights Reserved.</p>
        </footer> 
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
</body>
</html>
